name: Apply Rwaq logo fix

on:
  push:
    branches:
      - fix-rwaq-logo
    paths:
      - scripts/fix-rwaq-logo-temp.cjs
      - .github/workflows/fix-rwaq-logo-temp.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-rwaq-logo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stable Rwaq logo source
        run: node scripts/fix-rwaq-logo-temp.cjs
      - name: Commit data change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix Rwaq logo source"
          git push origin HEAD:fix-rwaq-logo
