name: Test platform directory

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply remaining platform categories once
        if: github.event_name == 'pull_request' && github.head_ref == 'complete-remaining-platform-categories'
        run: |
          node scripts/apply-remaining-categories-temp.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json research-data.json tests/fixtures/category-effective-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m "Complete remaining platform categories"
            git push origin HEAD:complete-remaining-platform-categories
          fi
      - name: Run unit and architecture tests
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        run: |
          for f in js/*.js scripts/*.cjs; do node --check "$f"; done
          for f in inline-worker/src/*.mjs; do node --check "$f"; done
      - name: Validate public CMS content
        run: node scripts/validate-content.cjs
      - name: Validate research content
        run: node scripts/validate-research-data.cjs
      - name: Require complete platform research
        run: node scripts/platform-paths-audit.cjs --require-complete
      - name: Verify Decap configuration matches data.json
        run: node scripts/generate-decap-config.cjs --check
      - name: Prevent legacy Supabase runtime dependencies
        run: |
          if grep -RniE 'SUPABASE_CONFIG|PlatformData|supabase-config\.js|platform-data\.js' index.html explore.html platform.html js admin; then
            echo 'Legacy Supabase runtime reference detected'
            exit 1
          fi
      - name: Run branch diff hygiene checks
        run: git diff --check origin/main...HEAD
