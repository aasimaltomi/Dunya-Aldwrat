<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#4f46e5">
  <base href="/devmyskilla.github.io/">
  <title>الصفحة غير موجودة | دنيا الدورات</title>
  <link id="appFavicon" rel="icon" type="image/svg+xml" href="favicon.svg?v=20260917">
  <link id="appManifest" rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/branding.css">
  <link rel="stylesheet" href="css/404.css">
</head>
<body class="not-found-shell">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container nav-inner">
      <a data-link="home" href="index.html" class="brand" aria-label="Dunya Al-Dawrat">
        <img class="brand-logo" data-asset="brandLogo" alt="">
        <span>
          <strong data-setting="siteName">دنيا الدورات</strong>
          <small data-i18n="tagline"></small>
        </span>
      </a>
      <div class="nav-actions">
        <select id="langSwitcher" class="lang-select" data-i18n-aria-label="language" aria-label="Language"></select>
        <button class="icon-btn" id="themeToggle" type="button" data-i18n-aria-label="theme" aria-label="Theme">
          <span data-icon="themeDark" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="not-found-page container">
    <section class="not-found-card" aria-labelledby="notFoundTitle">
      <div class="not-found-visual" aria-hidden="true">
        <span class="not-found-orbit orbit-one"></span>
        <span class="not-found-orbit orbit-two"></span>
        <strong class="not-found-code">404</strong>
      </div>
      <div class="not-found-copy">
        <span class="eyebrow"><span class="pulse-dot"></span><span data-i18n="notFoundEyebrow">خطأ 404</span></span>
        <h1 id="notFoundTitle" data-i18n="notFoundTitle">الصفحة غير موجودة</h1>
        <p data-i18n="notFoundMessage">يبدو أن الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>
        <div class="not-found-actions">
          <a class="btn btn-primary" href="index.html" data-i18n="notFoundHome">العودة للرئيسية</a>
          <a class="btn btn-soft" href="explore.html" data-i18n="notFoundExplore">استكشف المنصات</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="not-found-footer">
    <div class="container">
      <strong data-setting="siteName">دنيا الدورات</strong>
      <span aria-hidden="true">•</span>
      <span data-setting="copyright"></span>
    </div>
  </footer>

  <script src="js/content-api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/site-runtime.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/404.js"></script>
</body>
</html>
